name: CI

# Typecheck and build on pull requests (the Pages workflow does the same before deploying main).
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
