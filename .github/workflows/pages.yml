name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Optional: use a vault that lives in a different repo (set repo variables VAULT_REPO / VAULT_BRANCH)
      - name: Check out external vault
        if: ${{ vars.VAULT_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.VAULT_REPO }}
          ref: ${{ vars.VAULT_BRANCH }}
          path: vault-external
      - run: npm install
      - run: npm run build:static
        env:
          VAULT_DIR: ${{ vars.VAULT_REPO != '' && 'vault-external' || 'vault' }}
          VAULT_REPO: ${{ vars.VAULT_REPO }}
          VAULT_BRANCH: ${{ vars.VAULT_BRANCH }}
          VAULT_REPO_PATH: ${{ vars.VAULT_REPO_PATH }}
          DEFAULT_LAYOUT: ${{ vars.DEFAULT_LAYOUT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
